<title>Daiki's Word Cards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a stack of ruled index cards on a desk; one sticky toolbar, list or single-card review */
:root{
  --desk:#eef1f4; --card:#ffffff; --ink:#1b2a3a; --muted:#5d6b7a;
  --rule:#d7e3ef; --margin:#e0475b; --accent:#2457c5; --accent-soft:#e3ebfb;
  --ok:#1f8a5b; --line:#cfd8e2;
  --f-display:"Bricolage Grotesque", "Zen Kaku Gothic New", system-ui, sans-serif;
  --f-body:"Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#10161d; --card:#18212b; --ink:#e6edf4; --muted:#93a2b2;
  --rule:#243243; --margin:#f06d7d; --accent:#7ea5ff; --accent-soft:#1e2d4a;
  --ok:#4cc58f; --line:#2a3846; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#10161d; --card:#18212b; --ink:#e6edf4; --muted:#93a2b2;
  --rule:#243243; --margin:#f06d7d; --accent:#7ea5ff; --accent-soft:#1e2d4a;
  --ok:#4cc58f; --line:#2a3846; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
header h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--desk);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px}
.tabs button,.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.tabs button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#q{flex:1 1 200px;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* index card */
.card{position:relative;background:var(--card);border-radius:4px;box-shadow:0 1px 0 var(--line),0 4px 14px -8px rgba(20,40,70,.25);
  padding:14px 18px 16px 34px;
  background-image:linear-gradient(var(--card) 46px,transparent 46px),repeating-linear-gradient(var(--card) 0 25px,var(--rule) 25px 26px);}
.card::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:1.5px;background:var(--margin);opacity:.7}
.card + .card{margin-top:0}
.list{display:flex;flex-direction:column;gap:12px}
details>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
.term{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.3;overflow-wrap:anywhere}
.tag{font-size:11px;letter-spacing:.06em;border-radius:3px;padding:1px 7px;border:1px solid currentColor;line-height:1.6}
.t-word{color:var(--accent)} .t-phrase{color:var(--ok)} .t-slang{color:var(--margin)}
.pos{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.gist{flex-basis:100%;color:var(--muted);font-size:14px;margin-top:-2px}
.done{font-size:12px;color:var(--ok);font-weight:700}
.body{display:flex;flex-direction:column;gap:12px;margin-top:12px;min-width:0}
.body h3{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono);font-weight:500}
.meaning{font-size:17px;font-weight:700}
.ex{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ex li{display:flex;gap:8px;align-items:flex-start}
.ex .en{font-family:var(--f-display);font-weight:500;font-size:16px}
.ex .ja{color:var(--muted);font-size:13px}
.syn{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.syn li{background:var(--accent-soft);border-radius:6px;padding:4px 10px;font-size:13px;max-width:100%}
.syn b{font-family:var(--f-display);font-weight:700}
.say{flex:none;border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:999px;width:28px;height:28px;cursor:pointer;font-size:13px;line-height:1}
.empty{text-align:center;color:var(--muted);padding:28px 18px 28px 34px}
.empty b{display:block;font-family:var(--f-display);color:var(--ink);font-size:20px;margin-bottom:4px}

/* review mode */
.stage{display:flex;flex-direction:column;gap:12px}
.flip{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;cursor:pointer;user-select:none}
.flip .big{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,9vw,52px);line-height:1.15;overflow-wrap:anywhere}
.flip .hint{font-size:12px;color:var(--muted)}
.flip .back{display:flex;flex-direction:column;gap:8px;max-width:520px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns button{font:inherit;font-weight:700;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btns .yes{background:var(--ok);border-color:var(--ok);color:#fff}
.progress{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.flip{transition:transform .25s}.flip:active{transform:scale(.99)}}
</style>

<div class="wrap">
  <header>
    <h1>Daiki's Word Cards</h1>
    <p>調べた単語・熟語・スラングがここにたまっていきます。カードをタップで詳細、🔊で発音。</p>
  </header>

  <div class="bar">
    <div class="tabs" role="group" aria-label="表示">
      <button id="tab-list" aria-pressed="true">一覧</button>
      <button id="tab-review" aria-pressed="false">カードで復習</button>
    </div>
    <div class="row" id="filters">
      <input id="q" type="search" placeholder="検索（英語・日本語・品詞 例：助動詞）" autocomplete="off">
      <button class="chip" data-f="all" aria-pressed="true">すべて</button>
      <button class="chip" data-f="word" aria-pressed="false">単語</button>
      <button class="chip" data-f="phrase" aria-pressed="false">熟語</button>
      <button class="chip" data-f="slang" aria-pressed="false">スラング</button>
      <button class="chip" data-f="todo" aria-pressed="false">まだ</button>
    </div>
    <div class="count" id="count">読み込み中…</div>
  </div>

  <section id="list" class="list" aria-live="polite">
    <div class="card empty"><b>単語を読み込んでいます</b>少しお待ちください。</div>
  </section>

  <section id="review" class="stage" hidden></section>
</div>

<script>
(function(){
  const TYPE = {word:"単語", phrase:"熟語", slang:"スラング"};
  let words = [], filter = "all", query = "", view = "list";
  let deck = [], idx = 0, flipped = false;
  let known = {};
  try { known = JSON.parse(localStorage.getItem("known") || "{}") || {}; } catch(e) { known = {}; }
  const saveKnown = () => { try { localStorage.setItem("known", JSON.stringify(known)); } catch(e){} };

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function speak(text){
    try{
      const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = 0.9;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(e){}
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-say]");
    if (b){ e.preventDefault(); e.stopPropagation(); speak(b.dataset.say); }
  });
  const sayBtn = t => `<button class="say" data-say="${esc(t)}" aria-label="${esc(t)} を再生">🔊</button>`;

  function visible(){
    const q = query.trim().toLowerCase();
    return words.filter(w => {
      if (filter === "todo" && known[w.id]) return false;
      if (["word","phrase","slang"].includes(filter) && w.type !== filter) return false;
      if (!q) return true;
      const hay = [w.term, w.meaning, w.nuance, w.pos, ...(w.tags||[]), ...(w.synonyms||[]).map(s=>s.term), ...(w.slang||[]).map(s=>s.term)].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }

  function details(w){
    const ex = (w.examples||[]).map(x => `<li>${sayBtn(x.en)}<div><div class="en">${esc(x.en)}</div><div class="ja">${esc(x.ja)}</div></div></li>`).join("");
    const chips = arr => (arr||[]).map(s => `<li><b>${esc(s.term)}</b>${s.note ? " — " + esc(s.note) : ""}</li>`).join("");
    return `
      <div><h3>意味</h3><div class="meaning">${esc(w.meaning)}</div></div>
      ${w.nuance ? `<div><h3>使い方・ニュアンス</h3><div>${esc(w.nuance)}</div></div>` : ""}
      ${ex ? `<div><h3>例文</h3><ul class="ex">${ex}</ul></div>` : ""}
      ${(w.synonyms||[]).length ? `<div><h3>類義語</h3><ul class="syn">${chips(w.synonyms)}</ul></div>` : ""}
      ${(w.slang||[]).length ? `<div><h3>近いスラング・くだけた言い方</h3><ul class="syn">${chips(w.slang)}</ul></div>` : ""}`;
  }

  function renderList(){
    const list = visible();
    $("#count").textContent = `${list.length} / ${words.length} 語 ・ 覚えた ${words.filter(w=>known[w.id]).length}`;
    if (!words.length){
      $("#list").innerHTML = `<div class="card empty"><b>まだ単語がありません</b>チャットで調べたい英単語を送ると、ここにカードが増えていきます。</div>`;
      return;
    }
    if (!list.length){
      $("#list").innerHTML = `<div class="card empty"><b>見つかりません</b>検索語や絞り込みを変えてみてください。</div>`;
      return;
    }
    $("#list").innerHTML = list.map(w => `
      <details class="card" data-id="${esc(w.id)}">
        <summary>
          <span class="term">${esc(w.term)}</span>
          <span class="tag t-${esc(w.type)}">${esc(TYPE[w.type]||w.type)}</span>
          ${w.pos ? `<span class="pos">${esc(w.pos)}</span>` : ""}
          ${known[w.id] ? `<span class="done">✓ 覚えた</span>` : ""}
          ${sayBtn(w.term)}
          <span class="gist">${esc(w.meaning)}</span>
        </summary>
        <div class="body">${details(w)}</div>
      </details>`).join("");
  }

  function startReview(){
    deck = visible().slice();
    for (let i = deck.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [deck[i],deck[j]] = [deck[j],deck[i]]; }
    idx = 0; flipped = false; renderReview();
  }
  function renderReview(){
    const st = $("#review");
    if (!deck.length){
      st.innerHTML = `<div class="card empty"><b>復習するカードがありません</b>${words.length ? "絞り込みを「すべて」にするか、別の条件を選んでください。" : "単語が追加されると、ここで復習できます。"}</div>`;
      return;
    }
    if (idx >= deck.length){
      st.innerHTML = `<div class="card empty"><b>おつかれさま！ 全${deck.length}枚おわりました</b>「まだ」で絞り込むと、覚えていないものだけ復習できます。</div>
        <div class="btns"><button id="again">もう一度</button><button class="yes" id="todo">「まだ」だけ復習</button></div>`;
      $("#again").onclick = startReview;
      $("#todo").onclick = () => { setFilter("todo"); startReview(); };
      return;
    }
    const w = deck[idx];
    st.innerHTML = `
      <div class="progress"><span>${idx+1} / ${deck.length}</span><span>${esc(TYPE[w.type]||"")}</span></div>
      <div class="card flip" id="flip" role="button" tabindex="0" aria-label="カードをめくる">
        <div class="big">${esc(w.term)}</div>
        ${sayBtn(w.term)}
        ${flipped
          ? `<div class="back"><div class="meaning">${esc(w.meaning)}</div>${(w.examples||[])[0] ? `<div class="ex"><div class="en">${esc(w.examples[0].en)}</div><div class="ja">${esc(w.examples[0].ja)}</div></div>` : ""}</div>`
          : `<div class="hint">タップして意味を見る</div>`}
      </div>
      <div class="btns"><button id="no">まだ</button><button class="yes" id="yes">覚えた</button></div>`;
    const flip = () => { flipped = !flipped; renderReview(); };
    $("#flip").onclick = flip;
    $("#flip").onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); flip(); } };
    $("#no").onclick = () => { delete known[w.id]; saveKnown(); idx++; flipped = false; renderReview(); };
    $("#yes").onclick = () => { known[w.id] = 1; saveKnown(); idx++; flipped = false; renderReview(); };
  }

  function setFilter(f){
    filter = f;
    document.querySelectorAll("[data-f]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === f)));
  }
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { setFilter(b.dataset.f); view === "list" ? renderList() : startReview(); });
  $("#q").addEventListener("input", e => { query = e.target.value; view === "list" ? renderList() : startReview(); });

  function setView(v){
    view = v;
    $("#tab-list").setAttribute("aria-pressed", String(v === "list"));
    $("#tab-review").setAttribute("aria-pressed", String(v === "review"));
    $("#list").hidden = v !== "list"; $("#review").hidden = v !== "review";
    v === "list" ? renderList() : startReview();
  }
  $("#tab-list").onclick = () => setView("list");
  $("#tab-review").onclick = () => setView("review");

  function fail(msg){
    $("#count").textContent = "";
    $("#list").innerHTML = `<div class="card empty"><b>単語帳を読み込めませんでした</b>${msg}</div>`;
  }

  (async function(){
    const timer = setTimeout(() => fail("通信に時間がかかっています。ページを開き直してください。"), 10000);
    const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!db){ clearTimeout(timer); fail("claude.ai にサインインした状態で開いてください。"); return; }
    db.collection("words").orderBy("addedAt", "desc").onSnapshot(snap => {
      clearTimeout(timer);
      words = snap.docs.map(d => Object.assign({id: d.id}, d.data()));
      view === "list" ? renderList() : (deck.length ? null : startReview());
    }, err => { clearTimeout(timer); fail("もう一度開き直してください。（" + esc(err && err.code) + "）"); });
  })();
})();
</script>
